openapi: 3.1.0
info:
  title: Notes authentication
  version: 1.0.0
paths:
  /v1/auth/signup/code:
    post:
      operationId: sendSignupCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '204':
          description: Code request accepted
        '409':
          description: Email is already registered (email_already_registered)
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { const: email_already_registered }
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/signup/verify:
    post:
      operationId: verifySignupCode
      requestBody:
        $ref: '#/components/requestBodies/EmailCode'
      responses:
        '200':
          description: Single-use proof for the verified email
          content:
            application/json:
              schema:
                type: object
                required: [proof]
                properties:
                  proof: { type: string, minLength: 43, maxLength: 43 }
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/signup:
    post:
      operationId: registerAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, proof, account, password]
              properties:
                email: { type: string, format: email }
                proof: { type: string, minLength: 43, maxLength: 43 }
                account: { type: string, minLength: 3, maxLength: 64 }
                password: { type: string, minLength: 8, maxLength: 1024, description: 'Counted in code points; emoji are rejected.', format: password, writeOnly: true }
      responses:
        '201':
          $ref: '#/components/responses/Session'
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/password/login:
    post:
      operationId: signInWithPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account, password]
              properties:
                account: { type: string, format: email, maxLength: 254, description: "Verified sign-in email" }
                password: { type: string, minLength: 1, maxLength: 1024, format: password, writeOnly: true }
      responses:
        '200':
          $ref: '#/components/responses/Session'
        '401':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/passkeys/registration/options:
    post:
      operationId: registrationOptions
      security:
        - bearer: []
      responses:
        '200':
          $ref: '#/components/responses/Options'
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/passkeys/registration/verify:
    post:
      operationId: registerPasskey
      security:
        - bearer: []
      requestBody:
        $ref: '#/components/requestBodies/PasskeyRegistrationResponse'
      responses:
        '204':
          description: Passkey added
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/passkeys/authentication/options:
    post:
      operationId: authenticationOptions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        '200':
          $ref: '#/components/responses/Options'
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/passkeys/authentication/verify:
    post:
      operationId: authenticatePasskey
      requestBody:
        $ref: '#/components/requestBodies/PasskeyResponse'
      responses:
        '200':
          $ref: '#/components/responses/Session'
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/passkeys:
    get:
      operationId: listPasskeys
      security:
        - bearer: []
      responses:
        '200':
          description: Passkeys registered to the current account
          content:
            application/json:
              schema:
                type: object
                required: [passkeys]
                properties:
                  passkeys:
                    type: array
                    items:
                      type: object
                      required: [id, createdAt]
                      properties:
                        id: { type: string }
                        createdAt: { type: string, format: date-time }
                        provider:
                          type: [string, 'null']
                          description: Password manager that created the credential, when identifiable
                        deviceBrand:
                          type: [string, 'null']
                          maxLength: 64
                          description: Device brand reported by the app that initiated registration
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/passkeys/{id}:
    delete:
      operationId: revokePasskey
      security:
        - bearer: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '204':
          description: No current credential remains with the given identifier
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/me:
    get:
      operationId: getProfile
      security: [{ bearer: [] }]
      responses:
        '200':
          description: Current account profile
          content:
            application/json:
              schema:
                type: object
                required: [id, account, email, avatarRevision]
                properties:
                  id: { type: string, format: uuid }
                  account: { type: string }
                  email: { type: string, format: email }
                  avatarRevision: { type: [string, 'null'], format: uuid }
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/me/username:
    put:
      operationId: updateUsername
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account]
              properties:
                account: { type: string, minLength: 3, maxLength: 64 }
      responses:
        '204':
          description: Login username updated
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/me/email/password:
    post:
      operationId: verifyEmailChangePassword
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, format: password, writeOnly: true }
      responses:
        '204':
          description: Current password verified
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/me/email/code:
    post:
      operationId: sendEmailChangeCode
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password, writeOnly: true }
      responses:
        '204':
          description: Code request accepted after password verification
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/me/email:
    put:
      operationId: changeEmail
      security: [{ bearer: [] }]
      requestBody:
        $ref: '#/components/requestBodies/EmailCode'
      responses:
        '204':
          description: Verified email updated
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/me/avatar:
    get:
      operationId: getAvatar
      security: [{ bearer: [] }]
      responses:
        '200':
          $ref: '#/components/responses/Avatar'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateAvatar
      security: [{ bearer: [] }]
      requestBody:
        description: JPEG with each side at most 512 pixels and a body no larger than 256 KiB
        required: true
        content:
          image/jpeg: {}
      responses:
        '200':
          $ref: '#/components/responses/Avatar'
        '400':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/session/refresh:
    post:
      operationId: refreshSession
      requestBody:
        $ref: '#/components/requestBodies/RefreshToken'
      responses:
        '200':
          $ref: '#/components/responses/Session'
        '401':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/session/logout:
    post:
      operationId: logout
      requestBody:
        $ref: '#/components/requestBodies/RefreshToken'
      responses:
        '204':
          description: Session revoked or already absent
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  requestBodies:
    EmailCode:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, code]
            properties:
              email: { type: string, format: email }
              code: { type: string, pattern: '^[0-9]{6}$', writeOnly: true }
    RefreshToken:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [refreshToken]
            properties:
              refreshToken: { type: string }
    PasskeyRegistrationResponse:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/PasskeyResponse'
              - type: object
                properties:
                  deviceBrand: { type: string, minLength: 1, maxLength: 64 }
    PasskeyResponse:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PasskeyResponse'
  schemas:
    PasskeyResponse:
      type: object
      required: [requestId, credential]
      properties:
        requestId: { type: string, format: uuid }
        credential:
          type: object
          description: WebAuthn JSON representation of the public-key credential returned by the platform
          required: [id, rawId, type, response, clientExtensionResults]
          properties:
            id: { type: string }
            rawId: { type: string }
            type: { const: public-key }
            response: { type: object }
            clientExtensionResults: { type: object }
  responses:
    Avatar:
      description: Private, normalized JPEG for the authenticated account
      headers:
        ETag:
          description: Quoted avatar revision UUID
          schema: { type: string }
        Cache-Control:
          schema: { const: no-store }
      content:
        image/jpeg: {}
    Session:
      description: Signed-in account and credentials
      content:
        application/json:
          schema:
            type: object
            required: [user, accessToken, refreshToken]
            properties:
              user:
                type: object
                required: [id, account]
                properties:
                  id: { type: string, format: uuid }
                  account: { type: string }
              accessToken: { type: string }
              refreshToken: { type: string }
    Options:
      description: Single-use request and WebAuthn options
      content:
        application/json:
          schema:
            type: object
            required: [requestId, publicKey]
            properties:
              requestId: { type: string, format: uuid }
              publicKey:
                type: object
                description: WebAuthn PublicKeyCredentialCreationOptionsJSON or PublicKeyCredentialRequestOptionsJSON
    Error:
      description: Request could not be completed
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string }
