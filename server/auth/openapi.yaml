openapi: 3.1.0
info:
  title: Notes authentication
  version: 1.0.0
paths:
  /v1/auth/mail:
    post:
      operationId: simulatedMail
      security: [{ bearer: [] }]
      description: >-
        Per-user simulated mailbox. No SMTP or cross-user delivery. Initializes once on first successful request.
        list excludes trash, ordered by createdAt DESC then id DESC, with fixed pages of 20.
        reply and replyAll share the owned source conversation; forward starts a new conversation.
        Repeated send operationId with identical payload returns the original mail; changed payload returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [contacts, list, detail, send, favorite, trash] }
                offset: { type: integer, minimum: 0, maximum: 100000, default: 0, description: list offset }
                query: { type: string, maxLength: 500, description: list search in subject and body }
                favorite: { type: boolean, description: list favorites only }
                threadId: { type: integer, minimum: 1, description: list other messages in this owned message's conversation }
                id: { type: integer, minimum: 1, description: required for detail }
                ids: { type: array, minItems: 1, maxItems: 100, items: { type: integer, minimum: 1 }, description: required for favorite and trash }
                important: { type: boolean, description: favorite target; omitted toggles current state }
                operationId: { type: string, format: uuid, description: required for send; stable across retries }
                recipientIds: { type: array, minItems: 1, maxItems: 5, items: { type: integer, minimum: 1, maximum: 5 }, description: required for send }
                subject: { type: string, maxLength: 500, description: required for send; may be empty }
                body: { type: string, minLength: 1, maxLength: 20000, description: required nonblank send content }
                mode: { type: string, enum: [new, reply, replyAll, forward], description: required for send }
                sourceId: { type: integer, minimum: 1, description: required for replies and forwards; omitted for new }
      responses:
        '200':
          description: contacts or list returns an array; detail or send returns a mail; mutations return an empty object
          content:
            application/json:
              schema:
                anyOf:
                  - { $ref: '#/components/schemas/SimulatedMail' }
                  - { type: array, items: { $ref: '#/components/schemas/SimulatedMail' } }
                  - { type: array, items: { $ref: '#/components/schemas/MailContact' } }
                  - { type: object, maxProperties: 0 }
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/signup/code:
    post:
      operationId: sendSignupCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '204':
          description: Code request accepted
        '409':
          description: Email is already registered (email_already_registered)
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { const: email_already_registered }
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/signup/verify:
    post:
      operationId: verifySignupCode
      requestBody:
        $ref: '#/components/requestBodies/EmailCode'
      responses:
        '200':
          description: Single-use proof for the verified email
          content:
            application/json:
              schema:
                type: object
                required: [proof]
                properties:
                  proof: { type: string, minLength: 43, maxLength: 43 }
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/signup:
    post:
      operationId: registerAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, proof, account, password]
              properties:
                email: { type: string, format: email }
                proof: { type: string, minLength: 43, maxLength: 43 }
                account: { type: string, minLength: 3, maxLength: 64 }
                password: { type: string, minLength: 8, maxLength: 1024, description: 'Counted in code points; emoji are rejected.', format: password, writeOnly: true }
      responses:
        '201':
          $ref: '#/components/responses/Session'
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/password/login:
    post:
      operationId: signInWithPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account, password]
              properties:
                account: { type: string, format: email, maxLength: 254, description: "Verified sign-in email" }
                password: { type: string, minLength: 1, maxLength: 1024, format: password, writeOnly: true }
      responses:
        '200':
          $ref: '#/components/responses/Session'
        '401':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/passkeys/registration/options:
    post:
      operationId: registrationOptions
      security:
        - bearer: []
      responses:
        '200':
          $ref: '#/components/responses/Options'
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/passkeys/registration/verify:
    post:
      operationId: registerPasskey
      security:
        - bearer: []
      requestBody:
        $ref: '#/components/requestBodies/PasskeyRegistrationResponse'
      responses:
        '204':
          description: Passkey added
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/passkeys/authentication/options:
    post:
      operationId: authenticationOptions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        '200':
          $ref: '#/components/responses/Options'
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/passkeys/authentication/verify:
    post:
      operationId: authenticatePasskey
      requestBody:
        $ref: '#/components/requestBodies/PasskeyResponse'
      responses:
        '200':
          $ref: '#/components/responses/Session'
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/passkeys:
    get:
      operationId: listPasskeys
      security:
        - bearer: []
      responses:
        '200':
          description: Passkeys registered to the current account
          content:
            application/json:
              schema:
                type: object
                required: [passkeys]
                properties:
                  passkeys:
                    type: array
                    items:
                      type: object
                      required: [id, createdAt]
                      properties:
                        id: { type: string }
                        createdAt: { type: string, format: date-time }
                        provider:
                          type: [string, 'null']
                          description: Password manager that created the credential, when identifiable
                        deviceBrand:
                          type: [string, 'null']
                          maxLength: 64
                          description: Device brand reported by the app that initiated registration
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/passkeys/{id}:
    delete:
      operationId: revokePasskey
      security:
        - bearer: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '204':
          description: No current credential remains with the given identifier
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/me:
    get:
      operationId: getProfile
      security: [{ bearer: [] }]
      responses:
        '200':
          description: Current account profile
          content:
            application/json:
              schema:
                type: object
                required: [id, account, email, avatarRevision]
                properties:
                  id: { type: string, format: uuid }
                  account: { type: string }
                  email: { type: string, format: email }
                  avatarRevision: { type: [string, 'null'], format: uuid }
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/me/username:
    put:
      operationId: updateUsername
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account]
              properties:
                account: { type: string, minLength: 3, maxLength: 64 }
      responses:
        '204':
          description: Login username updated
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/me/email/password:
    post:
      operationId: verifyEmailChangePassword
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, format: password, writeOnly: true }
      responses:
        '204':
          description: Current password verified
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/me/email/code:
    post:
      operationId: sendEmailChangeCode
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password, writeOnly: true }
      responses:
        '204':
          description: Code request accepted after password verification
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/me/email:
    put:
      operationId: changeEmail
      security: [{ bearer: [] }]
      requestBody:
        $ref: '#/components/requestBodies/EmailCode'
      responses:
        '204':
          description: Verified email updated
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/me/avatar:
    get:
      operationId: getAvatar
      security: [{ bearer: [] }]
      responses:
        '200':
          $ref: '#/components/responses/Avatar'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateAvatar
      security: [{ bearer: [] }]
      requestBody:
        description: JPEG with each side at most 512 pixels and a body no larger than 256 KiB
        required: true
        content:
          image/jpeg: {}
      responses:
        '200':
          $ref: '#/components/responses/Avatar'
        '400':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/session/refresh:
    post:
      operationId: refreshSession
      requestBody:
        $ref: '#/components/requestBodies/RefreshToken'
      responses:
        '200':
          $ref: '#/components/responses/Session'
        '401':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/session/logout:
    post:
      operationId: logout
      requestBody:
        $ref: '#/components/requestBodies/RefreshToken'
      responses:
        '204':
          description: Session revoked or already absent
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  requestBodies:
    EmailCode:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, code]
            properties:
              email: { type: string, format: email }
              code: { type: string, pattern: '^[0-9]{6}$', writeOnly: true }
    RefreshToken:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [refreshToken]
            properties:
              refreshToken: { type: string, writeOnly: true }
              operationId:
                type: string
                format: uuid
                writeOnly: true
                description: Persist before refreshing. Reuse with the original token to recover the same result within five minutes or to revoke a pending rotation.
    PasskeyRegistrationResponse:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/PasskeyResponse'
              - type: object
                properties:
                  deviceBrand: { type: string, minLength: 1, maxLength: 64 }
    PasskeyResponse:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PasskeyResponse'
  schemas:
    MailContact:
      type: object
      required: [id, firstName, lastName, email, altEmail, avatar, isDefault]
      properties:
        id: { type: integer }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string }
        altEmail: { type: string }
        avatar: { type: string, description: Bundled avatar resource key }
        isDefault: { type: boolean }
    SimulatedMail:
      type: object
      required: [id, sender, recipients, subject, body, mailbox, isImportant, isStarred, createdAt, threads]
      properties:
        id: { type: integer }
        sender: { $ref: '#/components/schemas/MailContact' }
        recipients: { type: array, items: { $ref: '#/components/schemas/MailContact' } }
        subject: { type: string }
        body: { type: string }
        mailbox: { type: string, enum: [INBOX, SENT, TRASH] }
        isImportant: { type: boolean }
        isStarred: { type: boolean, const: false }
        createdAt: { type: string, format: date-time }
        threads: { type: array, maxItems: 0, items: {} }
    PasskeyResponse:
      type: object
      required: [requestId, credential]
      properties:
        requestId: { type: string, format: uuid }
        credential:
          type: object
          description: WebAuthn JSON representation of the public-key credential returned by the platform
          required: [id, rawId, type, response, clientExtensionResults]
          properties:
            id: { type: string }
            rawId: { type: string }
            type: { const: public-key }
            response: { type: object }
            clientExtensionResults: { type: object }
  responses:
    Avatar:
      description: Private, normalized JPEG for the authenticated account
      headers:
        ETag:
          description: Quoted avatar revision UUID
          schema: { type: string }
        Cache-Control:
          schema: { const: no-store }
      content:
        image/jpeg: {}
    Session:
      description: Signed-in account and credentials
      content:
        application/json:
          schema:
            type: object
            required: [user, accessToken, refreshToken]
            properties:
              user:
                type: object
                required: [id, account]
                properties:
                  id: { type: string, format: uuid }
                  account: { type: string }
              accessToken: { type: string }
              refreshToken: { type: string }
    Options:
      description: Single-use request and WebAuthn options
      content:
        application/json:
          schema:
            type: object
            required: [requestId, publicKey]
            properties:
              requestId: { type: string, format: uuid }
              publicKey:
                type: object
                description: WebAuthn PublicKeyCredentialCreationOptionsJSON or PublicKeyCredentialRequestOptionsJSON
    Error:
      description: Request could not be completed
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string }
