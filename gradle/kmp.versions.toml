koin-ktor = { group = "io.insert-koin", name = "koin-ktor" }

# Compose Preference : https://github.com/zhanghai/ComposePreference
compose-preference = { group = "me.zhanghai.compose.preference", name = "preference", version = "2.2.0" }

# Calf : https://github.com/MohamedRejeb/Calf
calf-file-picker = { group = "com.mohamedrejeb.calf", name = "calf-file-picker", version.ref = "calf" }

detekt-formatting = { group = "dev.detekt", name = "detekt-rules-ktlint-wrapper", version.ref = "detekt" }

### Gradle 插件 marker（供 build-logic convention plugins 编译期引用）
