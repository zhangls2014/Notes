# detekt 配置
#
# 只登记本仓库相对 detekt 内置默认配置的偏离项；内置默认由 build-logic 的
# `me.zhangls.detekt` 约定插件通过 buildUponDefaultConfig = true 提供
# （2.0.0-alpha.6 的完整默认为 detekt-core 内的 default-detekt-config.yml，859 行）。
#
# 迁移说明：本文件此前是 detekt 1.x 的逐字默认模板（803 行），与版本目录 pin 的
# 2.0.0-alpha.6 根本性不兼容 —— 78 处 schema 错误、14 个规则在 2.x 已移除或改名、
# 阈值属性整体改名（threshold -> allowedComplexity / allowedLines / allowedDepth …）、
# 顶层 build: 与 output-reports: 两个段已被移除。迁移时逐属性比对了 2.x 内置默认，
# 确认原文件相对 1.x 默认模板的真实改动只有下面两处 ignoreAnnotated。
#
# 门禁开关注意：2.x 的 DetektExtension 已无 maxIssues（原 build.maxIssues: 0 失去载体），
# 改由约定插件的 failOnSeverity 控制，
# 见 build-logic/src/main/kotlin/me.zhangls.detekt.gradle.kts。
#
# 另：UndocumentedPublicClass 等默认关闭的规则无需在此显式声明 active: false ——
# 约定插件未开启 allRules，默认关闭的规则本来就不会运行。

complexity:
  LongParameterList:
    # @Composable 函数的参数数量由 UI 结构决定，不应受本规则约束
    ignoreAnnotated:
      - Composable
      - Preview

naming:
  MatchingDeclarationName:
    # 项目允许多个相关声明按共同职责命名，准确性由代码审查判断。
    active: false
  FunctionNaming:
    # @Composable 按 Compose 约定使用 PascalCase，与 functionPattern 的大小写规则冲突
    ignoreAnnotated:
      - Composable
      - Preview

ktlint:
  Filename:
    # 与根 AGENTS.md 的职责命名约定一致，PascalCase 由代码审查约束。
    active: false
  FunctionSignature:
    # 签名规则独立读取缩进大小，与下方 Indentation 保持一致。
    indentSize: 2
  Indentation:
    # 项目惯例为 2 空格缩进（全仓 .kt/.kts 实测：前导空格呈 2/4/6/8 等差分布，
    # AGENTS.md 中的示例亦为 2 空格），而 ktlint 规则集默认 indentSize: 4。
    # 按既有代码风格对齐，而非改动约 200 个源文件去适配 4 空格。
    indentSize: 2
  AnnotationOnSeparateLine:
    indentSize: 2
  ArgumentListWrapping:
    indentSize: 2
  BinaryExpressionWrapping:
    indentSize: 2
  ChainWrapping:
    indentSize: 2
  ClassSignature:
    indentSize: 2
  CommentWrapping:
    indentSize: 2
  ConditionWrapping:
    indentSize: 2
  ContextReceiverListWrapping:
    indentSize: 2
  ContextReceiverMapping:
    indentSize: 2
  EnumWrapping:
    indentSize: 2
  FunctionExpressionBody:
    indentSize: 2
  FunctionLiteral:
    indentSize: 2
  KdocWrapping:
    indentSize: 2
  ModifierListSpacing:
    indentSize: 2
  MultiLineIfElse:
    indentSize: 2
  MultilineLoop:
    indentSize: 2
  ParameterListWrapping:
    indentSize: 2
  ParameterWrapping:
    indentSize: 2
  PropertyWrapping:
    indentSize: 2
  SpacingAroundCurly:
    indentSize: 2
  StatementWrapping:
    indentSize: 2
  TypeArgumentListSpacing:
    indentSize: 2
  TypeParameterListSpacing:
    indentSize: 2
  Wrapping:
    indentSize: 2

# 与 Compose 入口及 AGP 测试布局对齐，不放宽生产代码规则。
style:
  UnusedPrivateFunction:
    # Preview 是 IDE 调用入口，与现有 inspections 入口约定一致。
    ignoreAnnotated:
      - Preview
  MagicNumber:
    # 保留 detekt 2.0.0-alpha.6 默认排除列表，补齐 AGP 9 的测试源集名。
    excludes:
      - '**/test/**'
      - '**/androidTest/**'
      - '**/commonTest/**'
      - '**/jvmTest/**'
      - '**/androidUnitTest/**'
      - '**/androidInstrumentedTest/**'
      - '**/androidHostTest/**'
      - '**/jsTest/**'
      - '**/iosTest/**'
      - '**/*.kts'

# 在默认协程规则上增加生命周期、测试启动和取消传播检查。
coroutines:
  GlobalCoroutineUsage:
    active: true
  CoroutineLaunchedInTestWithoutRunTest:
    active: true
  SuspendFunSwallowedCancellation:
    active: true

# Compose Rules 0.6.8：默认启用项沿用库配置，仅补齐四条默认关闭的规则。
Compose:
  ComposableNestingDepth:
    active: true
  Material2:
    active: true
  PreviewNaming:
    active: true
  UnstableCollections:
    active: true
